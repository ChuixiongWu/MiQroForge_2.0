# AWS Braket Credentials — K8s Secret Template
# ═══════════════════════════════════════════════════════════════════════════
# DO NOT commit this file with real credentials.
# Copy and fill in real values before applying:
#   cp aws-braket-secret.example.yaml aws-braket-secret.yaml
#   # Edit aws-braket-secret.yaml with real values
#   kubectl apply -f aws-braket-secret.yaml
#
# Guard: confirm ARGO_NAMESPACE before applying to avoid deploying to
# the wrong cluster/namespace:
#   ARGO_NS=$(grep ARGO_NAMESPACE ../../.env | cut -d= -f2)
#   echo "Applying to namespace: $ARGO_NS"  # must be miqroforge-dev
#   kubectl apply -f aws-braket-secret.yaml -n "$ARGO_NS"
#
# Pre-requisites:
#   - Namespace miqroforge-dev must already exist (created by rbac-dev.yaml
#     or setup_infra.sh).
#   - The AWS IAM user (mqe-quantum-dev) must have Braket + S3 permissions.
#   - Region: us-east-1 (verified working with Braket API as of 2026-05-27).
#   - S3 bucket: amazon-braket-mqe-533612071261 (must exist in the account).
# ═══════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: aws-braket-creds
  namespace: miqroforge-dev
  labels:
    miqroforge.io/component: credentials
    miqroforge.io/provider: aws-braket
    miqroforge.io/region: us-east-1
type: Opaque
stringData:
  # ⚠️  Replace with real values from ~/.aws/credentials (DO NOT COMMIT)
  AWS_ACCESS_KEY_ID: "YOUR_AWS_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "YOUR_AWS_SECRET_ACCESS_KEY"
  AWS_DEFAULT_REGION: "us-east-1"
